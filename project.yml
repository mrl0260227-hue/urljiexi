name: DouyinDownloader
options:
  bundleIdPrefix: com.yourname
targets:
  DouyinDownloader:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - Sources
    settings:
      INFOPLIST_FILE: Sources/Info.plist
      PRODUCT_BUNDLE_IDENTIFIER: com.yourname.douyindownloader
      MARKETING_VERSION: 1.0.0
      CURRENT_PROJECT_VERSION: 1
      CODE_SIGNING_ALLOWED: NO # 暂时不允许签名，方便在 GitHub Actions 中构建未签名的 IPA
