name: Build iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Archive App
        run: |
          xcodebuild archive -project DouyinDownloader.xcodeproj \
                             -scheme DouyinDownloader \
                             -archivePath DouyinDownloader.xcarchive \
                             -sdk iphoneos \
                             -configuration Release \
                             CODE_SIGNING_ALLOWED=NO \
                             CODE_SIGNING_REQUIRED=NO \
                             CODE_SIGN_IDENTITY="" \
                             PROVISIONING_PROFILE_SPECIFIER=""

      - name: Export IPA (Pseudo-Export)
        run: |
          mkdir -p Payload
          # 归档模式下，.app 文件就在这个固定路径
          APP_PATH="DouyinDownloader.xcarchive/Products/Applications/DouyinDownloader.app"
          
          if [ ! -d "$APP_PATH" ]; then
            echo "Error: App not found in archive!"
            exit 1
          fi

          # 赋予执行权限
          chmod -R +x "$APP_PATH"
          cp -RP "$APP_PATH" Payload/
          zip -r DouyinDownloader.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DouyinDownloader-IPA
          path: DouyinDownloader.ipa
