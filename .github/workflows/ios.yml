name: Build iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: |
          xcodegen generate
          # 验证：检查工程文件是否真的包含了源文件引用
          grep "ContentView.swift" DouyinDownloader.xcodeproj/project.pbxproj || (echo "错误：源文件未正确关联到工程！" && exit 1)

      - name: Archive App
        run: |
          xcodebuild archive -project DouyinDownloader.xcodeproj \
                             -scheme DouyinDownloader \
                             -archivePath DouyinDownloader.xcarchive \
                             -sdk iphoneos \
                             -configuration Release \
                             CODE_SIGNING_ALLOWED=NO \
                             CODE_SIGNING_REQUIRED=NO \
                             CODE_SIGN_IDENTITY="" \
                             PROVISIONING_PROFILE_SPECIFIER="" \
                             AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package IPA
        run: |
          rm -rf Payload DouyinDownloader.ipa
          mkdir -p Payload
          
          APP_PATH="DouyinDownloader.xcarchive/Products/Applications/DouyinDownloader.app"
          
          # 修复二进制执行权限（解决 Sideloadly 报错 Invalid file 的核心）
          chmod +x "$APP_PATH/DouyinDownloader"
          rm -rf "$APP_PATH/_CodeSignature"
          
          cp -a "$APP_PATH" Payload/
          zip -q -r DouyinDownloader.ipa Payload
          
          echo "==== IPA 结构验证 ===="
          unzip -l DouyinDownloader.ipa | head -n 15

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DouyinDownloader-IPA
          path: DouyinDownloader.ipa
          retention-days: 5
