name: Build iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build App
        run: |
          xcodebuild -project DouyinDownloader.xcodeproj \
                     -scheme DouyinDownloader \
                     -sdk iphoneos \
                     -configuration Release \
                     -destination 'generic/platform=iOS' \
                     -derivedDataPath build \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     PROVISIONING_PROFILE_SPECIFIER="" \
                     AD_HOC_CODE_SIGNING_ALLOWED=YES \
                     COMPILER_INDEX_STORE_ENABLE=NO \
                     clean build

      - name: Create Payload Directory
        if: success()
        run: |
          mkdir -p Payload
          # 尝试从所有可能的输出路径查找 .app
          APP_PATH=$(find build -name "*.app" -type d | grep -v "Index" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: Could not find .app file anywhere!"
            exit 1
          fi
          echo "Found App at: $APP_PATH"
          cp -r "$APP_PATH" Payload/

      - name: Package IPA
        if: success()
        run: |
          zip -r DouyinDownloader.ipa Payload

      - name: Upload Artifact
        if: always() # 即使失败也尝试上传，方便查看是否有部分产物
        uses: actions/upload-artifact@v4
        with:
          name: DouyinDownloader-IPA
          path: DouyinDownloader.ipa
          retention-days: 5
