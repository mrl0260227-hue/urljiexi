name: Build iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Verify Source Files
        run: |
          echo "==== 检查源码文件列表 ===="
          ls -R Sources/
          if [ ! -f "Sources/ContentView.swift" ]; then
            echo "错误：未能在 Sources 目录下找到 ContentView.swift！请检查文件夹结构。"
            exit 1
          fi

      - name: Generate Xcode Project
        run: |
          xcodegen generate
          echo "==== 验证工程文件是否包含源码引用 ===="
          grep ".swift" DouyinDownloader.xcodeproj/project.pbxproj || (echo "错误：工程文件中没有关联任何 Swift 源文件！" && exit 1)

      - name: Archive App
        run: |
          xcodebuild archive -project DouyinDownloader.xcodeproj \
                             -scheme DouyinDownloader \
                             -archivePath DouyinDownloader.xcarchive \
                             -sdk iphoneos \
                             -configuration Release \
                             CODE_SIGNING_ALLOWED=NO \
                             CODE_SIGNING_REQUIRED=NO \
                             CODE_SIGN_IDENTITY="" \
                             PROVISIONING_PROFILE_SPECIFIER=""

      - name: Package IPA
        run: |
          mkdir -p Payload
          APP_PATH="DouyinDownloader.xcarchive/Products/Applications/DouyinDownloader.app"
          
          if [ ! -d "$APP_PATH" ]; then
            echo "错误：未能找到编译生成的 .app 文件！"
            exit 1
          fi

          # 核心修复：为二进制文件赋予可执行权限，否则 Sideloadly 会报 Invalid file
          chmod -R +x "$APP_PATH"
          
          # 检查生成的二进制文件大小，确保不是 0KB
          BINARY_SIZE=$(ls -lh "$APP_PATH/DouyinDownloader" | awk '{print $5}')
          echo "主程序二进制文件大小为: $BINARY_SIZE"

          cp -RP "$APP_PATH" Payload/
          zip -r DouyinDownloader.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DouyinDownloader-IPA
          path: DouyinDownloader.ipa
          retention-days: 5
