name: Build iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4 # 升级到 v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate --quiet

      - name: Archive App
        run: |
          xcodebuild archive -project DouyinDownloader.xcodeproj \
                             -scheme DouyinDownloader \
                             -archivePath DouyinDownloader.xcarchive \
                             -sdk iphoneos \
                             -configuration Release \
                             -quiet \
                             CODE_SIGNING_ALLOWED=NO \
                             CODE_SIGNING_REQUIRED=NO \
                             CODE_SIGN_IDENTITY="" \
                             PROVISIONING_PROFILE_SPECIFIER="" \
                             AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package IPA
        run: |
          rm -rf Payload DouyinDownloader.ipa
          mkdir -p Payload
          APP_PATH="DouyinDownloader.xcarchive/Products/Applications/DouyinDownloader.app"
          
          # 修复权限与清理签名
          chmod +x "$APP_PATH/DouyinDownloader"
          rm -rf "$APP_PATH/_CodeSignature"
          
          cp -a "$APP_PATH" Payload/
          zip -q -r DouyinDownloader.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4 # 核心修复：升级到 v4
        with:
          name: DouyinDownloader-IPA
          path: DouyinDownloader.ipa
          retention-days: 5
