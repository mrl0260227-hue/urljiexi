name: Build iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Verify Project Structure
        run: |
          echo "==== 确认源码目录内容 ===="
          ls -R Sources/
          # 检查关键文件是否存在
          test -f "Sources/ContentView.swift" || (echo "错误：未找到 ContentView.swift" && exit 1)

      - name: Generate Xcode Project
        run: |
          xcodegen generate
          echo "==== 验证工程文件是否成功关联源码 ===="
          # 检查生成的 pbxproj 文件中是否包含 Swift 文件的引用
          grep -q ".swift" DouyinDownloader.xcodeproj/project.pbxproj || (echo "错误：生成的工程中没有代码引用！" && exit 1)

      - name: Archive App
        run: |
          xcodebuild archive -project DouyinDownloader.xcodeproj \
                             -scheme DouyinDownloader \
                             -archivePath DouyinDownloader.xcarchive \
                             -sdk iphoneos \
                             -configuration Release \
                             CODE_SIGNING_ALLOWED=NO \
                             CODE_SIGNING_REQUIRED=NO \
                             CODE_SIGN_IDENTITY="" \
                             PROVISIONING_PROFILE_SPECIFIER=""

      - name: Package IPA
        run: |
          mkdir -p Payload
          APP_PATH="DouyinDownloader.xcarchive/Products/Applications/DouyinDownloader.app"
          
          if [ ! -d "$APP_PATH" ]; then
            echo "错误：找不到编译生成的 .app 文件夹！"
            exit 1
          fi

          # 赋予所有二进制文件执行权限，防止 Sideloadly 报错
          chmod -R 755 "$APP_PATH"
          
          # 打印主程序体积，正常应大于 100KB
          SIZE=$(ls -lh "$APP_PATH/DouyinDownloader" | awk '{print $5}')
          echo "主程序二进制体积: $SIZE"

          cp -RP "$APP_PATH" Payload/
          zip -r DouyinDownloader.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DouyinDownloader-IPA
          path: DouyinDownloader.ipa
          retention-days: 5
