name: Build iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - uses: actions/checkout@v4  # 更新到 v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build App
        run: |
          xcodebuild -project DouyinDownloader.xcodeproj \
                     -scheme DouyinDownloader \
                     -sdk iphoneos \
                     -configuration Release \
                     -derivedDataPath build \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     AD_HOC_CODE_SIGNING_ALLOWED=YES \
                     clean build

      - name: Create Payload Directory
        run: |
          mkdir -p Payload
          # 动态查找生成的 .app 文件
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: Could not find .app file in build directory"
            # 尝试更大范围查找作为备份
            APP_PATH=$(find build -name "*.app" -type d | head -n 1)
          fi
          echo "Found App at: $APP_PATH"
          cp -r "$APP_PATH" Payload/

      - name: Package IPA
        run: |
          zip -r DouyinDownloader.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4  # 必须更新到 v4，解决您图片中的报错
        with:
          name: DouyinDownloader-IPA
          path: DouyinDownloader.ipa
          retention-days: 5  # 设置保存天数
