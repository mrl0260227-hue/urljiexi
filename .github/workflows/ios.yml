name: Build iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate --quiet

      - name: Archive App
        run: |
          xcodebuild archive -project DouyinDownloader.xcodeproj \
                             -scheme DouyinDownloader \
                             -archivePath DouyinDownloader.xcarchive \
                             -sdk iphoneos \
                             -configuration Release \
                             -quiet \
                             CODE_SIGNING_ALLOWED=NO \
                             CODE_SIGNING_REQUIRED=NO \
                             CODE_SIGN_IDENTITY="" \
                             PROVISIONING_PROFILE_SPECIFIER="" \
                             AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package IPA
        run: |
          # 1. 清理并准备 Payload 目录
          rm -rf Payload DouyinDownloader.ipa
          mkdir -p Payload
          
          # 2. 定位生成的 .app 文件夹
          APP_PATH="DouyinDownloader.xcarchive/Products/Applications/DouyinDownloader.app"
          
          # 3. 【关键修复】强制赋予二进制文件执行权限
          # 只有这样 Sideloadly 才能识别它是有效的安装包
          chmod +x "$APP_PATH/DouyinDownloader"
          
          # 4. 清理云端产生的残留签名（防止与 Sideloadly 冲突）
          rm -rf "$APP_PATH/_CodeSignature"
          
          # 5. 纯净拷贝并打包（排除 macOS 特有的隐藏文件）
          cp -a "$APP_PATH" Payload/
          zip -q -r DouyinDownloader.ipa Payload -x "*.DS_Store"
          
          echo "==== 验证 IPA 结构 ===="
          unzip -l DouyinDownloader.ipa | head -n 15

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DouyinDownloader-IPA
          path: DouyinDownloader.ipa
          retention-days: 5
