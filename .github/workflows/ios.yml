name: Build iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: macos-14 # 指定 M1/M2 运行器
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          # 强制切换到最新的 Xcode 15 或 16 环境
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Project
        run: xcodegen generate --spec project.yml

      - name: Build App
        run: |
          xcodebuild build -project DouyinDownloader.xcodeproj \
                           -scheme DouyinDownloader \
                           -sdk iphoneos \
                           -configuration Release \
                           -derivedDataPath build_output \
                           -quiet \
                           CODE_SIGNING_ALLOWED=NO \
                           CODE_SIGNING_REQUIRED=NO \
                           CODE_SIGN_IDENTITY="" \
                           AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find build_output -name "*.app" -type d | head -n 1)
          echo "Found App at: $APP_PATH"
          
          if [ -z "$APP_PATH" ]; then
            echo "❌ 错误：未找到生成的 .app 文件"
            exit 1
          fi

          chmod +x "$APP_PATH/DouyinDownloader"
          rm -rf "$APP_PATH/_CodeSignature"
          
          cp -a "$APP_PATH" Payload/
          zip -q -r DouyinDownloader.ipa Payload
          
          echo "==== IPA 结构验证 ===="
          unzip -l DouyinDownloader.ipa | head -n 15

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DouyinDownloader-IPA
          path: DouyinDownloader.ipa
          retention-days: 5
