name: Build iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    # 使用 Apple Silicon 运行器，速度极快且更稳定
    runs-on: macos-14
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Project
        timeout-minutes: 3
        run: |
          # 显式指定 spec 文件，减少扫描范围
          xcodegen generate --spec project.yml --quiet
          echo "✅ Project generated"

      - name: Archive App
        run: |
          # 使用 archive 模式生成标准的 .app 结构
          xcodebuild archive -project DouyinDownloader.xcodeproj \
                             -scheme DouyinDownloader \
                             -archivePath DouyinDownloader.xcarchive \
                             -sdk iphoneos \
                             -configuration Release \
                             -quiet \
                             CODE_SIGNING_ALLOWED=NO \
                             CODE_SIGNING_REQUIRED=NO \
                             CODE_SIGN_IDENTITY="" \
                             AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package IPA
        run: |
          mkdir -p Payload
          APP_PATH="DouyinDownloader.xcarchive/Products/Applications/DouyinDownloader.app"
          
          # 核心修复：赋予执行权限并清理残留
          chmod +x "$APP_PATH/DouyinDownloader"
          rm -rf "$APP_PATH/_CodeSignature"
          
          cp -a "$APP_PATH" Payload/
          zip -q -r DouyinDownloader.ipa Payload
          
          echo "==== IPA 结构预览 ===="
          unzip -l DouyinDownloader.ipa | head -n 15

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DouyinDownloader-IPA
          path: DouyinDownloader.ipa
          retention-days: 5
