name: Build iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: macos-14
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Project
        run: |
          # 移除 quiet 以便观察是否生成成功
          xcodegen generate --spec project.yml
          ls -R DouyinDownloader.xcodeproj # 物理确认工程已生成

      - name: Build App
        run: |
          # 改用 build 模式，并明确指定输出路径
          xcodebuild build -project DouyinDownloader.xcodeproj \
                           -scheme DouyinDownloader \
                           -sdk iphoneos \
                           -configuration Release \
                           -derivedDataPath build_output \
                           -quiet \
                           CODE_SIGNING_ALLOWED=NO \
                           CODE_SIGNING_REQUIRED=NO \
                           CODE_SIGN_IDENTITY="" \
                           AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package IPA
        run: |
          mkdir -p Payload
          # 动态查找 build_output 目录下的 .app 文件
          APP_PATH=$(find build_output -name "*.app" -type d | head -n 1)
          echo "Found App at: $APP_PATH"
          
          if [ -z "$APP_PATH" ]; then
            echo "❌ 错误：未找到生成的 .app 文件"
            exit 1
          fi

          # 修复权限与清理签名
          chmod +x "$APP_PATH/DouyinDownloader"
          rm -rf "$APP_PATH/_CodeSignature"
          
          cp -a "$APP_PATH" Payload/
          zip -q -r DouyinDownloader.ipa Payload
          
          echo "==== IPA 结构验证 ===="
          unzip -l DouyinDownloader.ipa | head -n 15

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DouyinDownloader-IPA
          path: DouyinDownloader.ipa
          retention-days: 5
