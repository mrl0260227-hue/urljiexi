name: Build iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: macos-14
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate and Force Downgrade Project
        run: |
          xcodegen generate --spec project.yml
          # 【核心修复】强制修改工程文件版本，解决 format (77) 报错
          sed -i '' 's/objectVersion = 77/objectVersion = 56/g' DouyinDownloader.xcodeproj/project.pbxproj
          echo "✅ Project generated and version forced to 56"

      - name: Build App
        run: |
          xcodebuild build -project DouyinDownloader.xcodeproj \
                           -scheme DouyinDownloader \
                           -sdk iphoneos \
                           -configuration Release \
                           -derivedDataPath build_output \
                           -quiet \
                           CODE_SIGNING_ALLOWED=NO \
                           CODE_SIGNING_REQUIRED=NO \
                           CODE_SIGN_IDENTITY="" \
                           AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find build_output -name "*.app" -type d | head -n 1)
          
          if [ -z "$APP_PATH" ]; then
            echo "❌ 错误：未找到生成的 .app 文件"
            exit 1
          fi

          chmod +x "$APP_PATH/DouyinDownloader"
          rm -rf "$APP_PATH/_CodeSignature"
          
          cp -a "$APP_PATH" Payload/
          zip -q -r DouyinDownloader.ipa Payload
          
          echo "==== IPA 结构验证 ===="
          unzip -l DouyinDownloader.ipa | head -n 15

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DouyinDownloader-IPA
          path: DouyinDownloader.ipa
          retention-days: 5
