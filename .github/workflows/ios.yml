name: Build iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - uses: actions/checkout@v3

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build App
        run: |
          xcodebuild -project DouyinDownloader.xcodeproj \
                     -scheme DouyinDownloader \
                     -sdk iphoneos \
                     -configuration Release \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     clean build

      - name: Create Payload Directory
        run: |
          mkdir -p build/Payload
          cp -r build/Release-iphoneos/DouyinDownloader.app build/Payload/

      - name: Package IPA
        run: |
          cd build
          zip -r DouyinDownloader.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v3
        with:
          name: DouyinDownloader-IPA
          path: build/DouyinDownloader.ipa
