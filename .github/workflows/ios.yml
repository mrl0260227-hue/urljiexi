name: Build iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build App
        run: |
          xcodebuild -project DouyinDownloader.xcodeproj \
                     -scheme DouyinDownloader \
                     -sdk iphoneos \
                     -configuration Release \
                     -derivedDataPath build \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     PROVISIONING_PROFILE_SPECIFIER="" \
                     AD_HOC_CODE_SIGNING_ALLOWED=YES \
                     clean build

      - name: Prepare IPA
        run: |
          mkdir -p Payload
          # 精确查找编译产物路径
          APP_PATH="build/Build/Products/Release-iphoneos/DouyinDownloader.app"
          
          if [ ! -d "$APP_PATH" ]; then
            echo "Error: Standard path not found, searching..."
            APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" -type d -maxdepth 1 | head -n 1)
          fi
          
          if [ -z "$APP_PATH" ]; then
            echo "Final Error: Could not find .app file!"
            exit 1
          fi

          echo "Using App at: $APP_PATH"
          
          # 修复权限位（解决 Windows/Sideloadly 可能的 Invalid file 报错）
          chmod -R +x "$APP_PATH"
          
          cp -RP "$APP_PATH" Payload/
          zip -r DouyinDownloader.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DouyinDownloader-IPA
          path: DouyinDownloader.ipa
          retention-days: 5
