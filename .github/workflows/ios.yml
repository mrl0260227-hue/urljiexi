name: Build Unsigned IPA (for Sideloadly)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build unsigned app
        run: |
          set -euo pipefail
          xcodebuild \
            -project DouyinDownloader.xcodeproj \
            -scheme DouyinDownloader \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Package IPA (Payload only)
        run: |
          set -euo pipefail
          rm -rf Payload DouyinDownloader.ipa
          mkdir -p Payload

          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" -type d | head -n 1)
          if [ -z "${APP_PATH}" ]; then
            echo "Error: .app not found"
            exit 1
          fi

          cp -R "${APP_PATH}" Payload/

          APP_NAME=$(basename "${APP_PATH}" .app)
          test -f "Payload/${APP_NAME}.app/Info.plist"
          test -f "Payload/${APP_NAME}.app/${APP_NAME}"
          plutil -lint "Payload/${APP_NAME}.app/Info.plist"

          # use ditto instead of zip -r to avoid invalid package structure issues
          ditto -c -k --sequesterRsrc --keepParent Payload DouyinDownloader.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: DouyinDownloader-IPA
          path: DouyinDownloader.ipa
