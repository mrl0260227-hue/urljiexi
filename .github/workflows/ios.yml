name: Build iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Verify Project Structure
        run: |
          echo "==== 确认源码目录内容 ===="
          ls -R Sources/
          test -f "Sources/ContentView.swift" || (echo "错误：未找到 ContentView.swift" && exit 1)

      - name: Generate Xcode Project
        run: |
          xcodegen generate
          echo "==== 验证工程文件是否关联源码 ===="
          grep ".swift" DouyinDownloader.xcodeproj/project.pbxproj || (echo "错误：工程未关联源码！" && exit 1)

      - name: Archive App
        run: |
          xcodebuild archive -project DouyinDownloader.xcodeproj \
                             -scheme DouyinDownloader \
                             -archivePath DouyinDownloader.xcarchive \
                             -sdk iphoneos \
                             -configuration Release \
                             CODE_SIGNING_ALLOWED=NO \
                             CODE_SIGNING_REQUIRED=NO \
                             CODE_SIGN_IDENTITY="" \
                             PROVISIONING_PROFILE_SPECIFIER=""

      - name: Package IPA
        run: |
          # 1. 创建干净的打包工作目录，避免产生冗余的层级（如 UT 路径）
          mkdir -p Package/Payload
          
          # 2. 定义编译产出的 .app 路径
          APP_PATH="DouyinDownloader.xcarchive/Products/Applications/DouyinDownloader.app"
          
          # 3. 强制修复权限：确保 205K 的二进制文件具有可执行权限
          chmod +x "$APP_PATH/DouyinDownloader"
          chmod -R 755 "$APP_PATH"

          # 4. 清理残留签名防止 Sideloadly 冲突
          rm -rf "$APP_PATH/_CodeSignature" 2>/dev/null || true

          # 5. 将 .app 复制到 Payload 文件夹中[cite: 1]
          cp -RP "$APP_PATH" Package/Payload/
          
          # 6. 核心步骤：进入 Package 目录进行压缩，确保 Payload 在 Zip 根目录[cite: 1]
          cd Package
          zip -r ../DouyinDownloader.ipa Payload
          
          # 7. 打印最终体积确认
          echo "==== 最终确认 ===="
          ls -lh ../DouyinDownloader.ipa

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DouyinDownloader-IPA
          path: DouyinDownloader.ipa
          retention-days: 5
